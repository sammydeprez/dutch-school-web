name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/change-request-attachments/**'
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20'
  GCP_PROJECT: 'dutchschoolke'
  GCP_REGION: 'us-central1'
  API_SERVICE: 'dutch-school-api'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          retention-days: 1

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: api
          retention-days: 1

  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # GitHub secrets stay the source of truth. A new Secret Manager version is
      # added only when the value changed, and older versions are destroyed, so
      # the project never holds more than the free six active versions.
      - name: Sync secrets to Secret Manager
        env:
          MAILERSEND_API_TOKEN: ${{ secrets.MAILERSEND_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ISSUES_PAT }}
        run: |
          for name in MAILERSEND_API_TOKEN GITHUB_TOKEN; do
            value="${!name}"
            current=$(gcloud secrets versions access latest --secret "$name" --project "$GCP_PROJECT" 2>/dev/null || true)
            if [ "$value" != "$current" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --data-file=- --project "$GCP_PROJECT"
              latest=$(gcloud secrets versions list "$name" --project "$GCP_PROJECT" --filter="state=ENABLED" --sort-by="~createTime" --format="value(name)" --limit=1)
              for v in $(gcloud secrets versions list "$name" --project "$GCP_PROJECT" --filter="state!=DESTROYED" --format="value(name)"); do
                [ "$v" = "$latest" ] || gcloud secrets versions destroy "$v" --secret "$name" --project "$GCP_PROJECT" --quiet
              done
            fi
          done

      # Firebase Hosting calls this service as an anonymous caller, so it needs
      # public invoker access, granted once by hand (see README § Deployment).
      - name: Deploy API (Cloud Run function)
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --source api \
            --function api \
            --base-image nodejs22 \
            --service-account "website-api@$GCP_PROJECT.iam.gserviceaccount.com" \
            --set-secrets "MAILERSEND_API_TOKEN=MAILERSEND_API_TOKEN:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest" \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --quiet

      - name: Deploy site (Firebase Hosting)
        run: npx -y firebase-tools@14 deploy --only hosting --project "$GCP_PROJECT" --non-interactive
